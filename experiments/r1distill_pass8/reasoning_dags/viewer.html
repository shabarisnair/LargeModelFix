<title>Reasoning DAG Inspector</title>
<style>
:root{
  --ground:#FAFBFC; --surface:#F0F3F6; --raised:#FFFFFF; --line:#DCE3EA;
  --ink:#0E141B; --muted:#63707E; --faint:#8B98A6;
  --accent:#1F6FB2; --accent-soft:#E3EEF7;
  --continue:#7B8B9C; --backtrack:#C2530C; --merge:#6D4AC4;
  --ok:#1B7F55;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0B0F14; --surface:#141A21; --raised:#1A222B; --line:#27313C;
    --ink:#E4EBF2; --muted:#8B98A6; --faint:#63707E;
    --accent:#5AA9E6; --accent-soft:#16283A;
    --continue:#6B7A8A; --backtrack:#E8813F; --merge:#A98BEA;
    --ok:#4FBF8B;
  }
}
:root[data-theme="dark"]{
  --ground:#0B0F14; --surface:#141A21; --raised:#1A222B; --line:#27313C;
  --ink:#E4EBF2; --muted:#8B98A6; --faint:#63707E;
  --accent:#5AA9E6; --accent-soft:#16283A;
  --continue:#6B7A8A; --backtrack:#E8813F; --merge:#A98BEA;
  --ok:#4FBF8B;
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
.app{display:grid; grid-template-columns:250px 1fr; height:100vh; overflow:hidden}
@media (max-width:900px){ .app{grid-template-columns:1fr; height:auto} }

.rail{background:var(--surface); border-right:1px solid var(--line); overflow-y:auto; padding:16px 0 30px}
.brand{padding:0 16px 12px; border-bottom:1px solid var(--line); margin-bottom:8px}
.brand h1{margin:0 0 4px; font-size:14.5px; font-weight:650; letter-spacing:-0.01em; text-wrap:balance}
.brand p{margin:0; font-size:11.5px; color:var(--muted); line-height:1.45}
.grp{padding:13px 16px 4px; font-family:var(--mono); font-size:10px; letter-spacing:0.09em;
  text-transform:uppercase; color:var(--faint)}
.q{display:block; width:100%; text-align:left; cursor:pointer; background:none; border:0;
  border-left:2px solid transparent; padding:7px 16px; color:var(--ink);
  font-family:var(--mono); font-size:11.5px}
.q:hover{background:var(--raised)}
.q[aria-current="true"]{background:var(--accent-soft); border-left-color:var(--accent)}
.q .qid{display:block; margin-bottom:2px}
.q .qm{display:flex; gap:10px; color:var(--muted); font-size:10px}
.q .qm b{font-weight:500; color:var(--faint)}
.q:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}

.main{display:flex; flex-direction:column; min-width:0; min-height:0}
.bar{display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:11px 18px;
  border-bottom:1px solid var(--line)}
.bar h2{margin:0; font-size:13.5px; font-family:var(--mono); font-weight:600}
.legend{display:flex; gap:13px; margin-left:auto; flex-wrap:wrap}
.lg{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); font-family:var(--mono)}
.sw{width:15px; height:0; border-top:2px solid}
.sw.dash{border-top-style:dashed}
.hint{font-size:11px; color:var(--faint); font-family:var(--mono)}

.panes{display:grid; grid-template-columns:1fr 1fr; flex:1; min-height:0}
@media (max-width:900px){ .panes{grid-template-columns:1fr} }
.pane{display:flex; flex-direction:column; min-width:0; min-height:0; border-right:1px solid var(--line)}
.pane:last-child{border-right:0}
.phead{padding:9px 14px; border-bottom:1px solid var(--line); background:var(--surface);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.chip{font-family:var(--mono); font-size:11px; font-weight:600; padding:2px 7px;
  border-radius:3px; background:var(--ink); color:var(--ground)}
.meta{font-family:var(--mono); font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.meta .good{color:var(--ok)}
.meta .bk{color:var(--backtrack)}
.meta .mg{color:var(--merge)}
.ctrls{display:flex; gap:5px; margin-left:auto}
.btn{font-family:var(--mono); font-size:10.5px; padding:4px 8px; cursor:pointer;
  background:var(--raised); color:var(--ink); border:1px solid var(--line); border-radius:4px}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.canvas{flex:1; min-height:0; position:relative; overflow:hidden; background:var(--ground);
  touch-action:none; cursor:grab}
.canvas.panning{cursor:grabbing}
.canvas svg{display:block; width:100%; height:100%}
.nd{cursor:pointer}
.nd rect{stroke-width:1.5}
.nd text{font-family:var(--mono); font-size:10px; pointer-events:none; fill:var(--ground)}
.nd.sel rect{stroke:var(--accent); stroke-width:2.5}
.nd.dim{opacity:.28}
.edge{fill:none}
.edge.dim{opacity:.12}

.detail{border-top:1px solid var(--line); background:var(--surface); padding:12px 18px 16px;
  height:220px; overflow:auto}
.detail.empty{color:var(--muted); font-size:12.5px}
.dhead{display:flex; align-items:center; gap:9px; margin-bottom:9px; flex-wrap:wrap}
.tag{font-family:var(--mono); font-size:10px; padding:2px 6px; border-radius:3px; border:1px solid currentColor}
.tag.continue{color:var(--continue)} .tag.backtrack{color:var(--backtrack)}
.tag.merge{color:var(--merge)} .tag.root{color:var(--muted)}
.dlabel{font-family:var(--mono); font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--faint); margin:10px 0 4px}
.dtext{white-space:pre-wrap; font-size:12.5px; line-height:1.55; max-width:70ch}
.dwhy{font-size:12px; line-height:1.5; color:var(--muted); max-width:70ch}
.step{border-left:2px solid var(--line); padding-left:10px; margin-bottom:8px}
.step .sid{font-family:var(--mono); font-size:10px; color:var(--faint)}
code{font-family:var(--mono); font-size:11.5px; background:var(--raised); padding:1px 4px; border-radius:3px}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<div class="app">
  <nav class="rail">

    </div>
    <div class="panes" id="panes"></div>

</div>

s are 1-based). So, for each element, if it's unique, we add its label to a list.","So, let's think about how to implement this.","First, I can create a frequency dictionary. For each A_i, count how many times it appears.","Then, for each index i (starting from 1 to N), check if the frequency of A_i is 1. If so, add the index (i) to a list of candidates.","If the list is empty, output -1.","Else, among these candidates, find the one with the maximum A_i. Then output their label.","Wait, but wait: the maximum A_i among the unique ones. So, for each candidate, we have their A_i, and we need the maximum of those.","So, how to do this efficiently?","Let's think about the steps:","- Read N, then the list A. But since the labels are 1-based, the list is 0-based in Python, but when processing, we'll consider 1-based indices.","For example, in sample input 1:","9\n2 9 9 7 9 2 4 5 8","The frequencies:","2 appears 2 times.\n9 appears 3 times.\n7 appears once.\n4 appears once.\n5 appears once.\n8 appears once.","So the unique A_i's are 7,4,5,8. Their positions are 4,7,8,9 (since indexes are 1-based). The maximum among these is 8, so output 9.","So, the plan is:","1. Read N and the list A.\n2. Create a frequency dictionary using a Counter from collections.\n3. Iterate through each element in A, check if its count is 1. Collect the indices (i+1) where this is true.\n4. If no such indices, output -1.\n5. Else, among the collected indices, find the one with the maximum A_i. Output that index.","Wait, but when we collect the indices, each of them has a unique A_i, so their A_i's are all unique. So, among them, the maximum is the one with the highest value.","But to find the maximum, I can iterate through the candidates and track the maximum value and its index.","Alternatively, since the list of candidates is all the unique ones, I can create a list of tuples (A_i, index) for each candidate, then sort them in descending order of A_i, and pick the first one's index.","But for large N, like up to 3e5, it's better to process this efficiently.","So, perhaps, during the iteration, we can keep track of the maximum value and the corresponding index.","Yes, that's better. So:","- Initialize max_val to -infinity, and max_index to -1.\n- For each candidate in the list of indices (i+1):\n   - Get the A_i (since it's unique, and the index is i+1)\n   - Compare A_i to max_val. If it's larger, update max_val and max_index.\n- At the end, if max_index is still -1, output -1. Else, output max_index.","Wait, but wait: the list of candidates is the indices where the A_i is unique. So for each candidate index, I can get A_i by A[index-1] (since the list is zero-based in Python).","So, putting it all together.","Now, the code steps:","Read N: n = int(input())","Read the list A: a = list(map(int, input().split()))","Create frequency count: from collections import Counter. freq = Counter(a)","Then, for each index i (0-based), check if freq[a[i]] == 1. If so, add (i+1) to the list of candidates.","If the list is empty, print -1.","Else, among the candidates, find the one with the maximum a[i-1].","Wait, no. Wait, for each candidate, the index is (i+1), so to get the value, it's a[i], since i is 0-based.","Wait, no. Wait, for i in 0-based, the label is i+1. So for the candidate index (i+1), the value is a[i].","Wait, no: a[i] is the value for the (i+1)th person. So, for the candidate, the value is a[i], and the label is i+1.","So, during the iteration over each element, when we find that the frequency is 1, we add (i+1) to the candidates list.","Once the candidates list is built, we need to find the candidate with the maximum a[i].","So, for each candidate in the list, the value is a[candidate - 1].","So, the code could be:","candidates = []\nfor i in range(n):\n    if freq[a[i]] == 1:\n        candidates.append(i+1)","if not candidates:\n    print(-1)\nelse:\n    max_val = -1\n    max_idx = -1\n    for idx in candidates:\n        val = a[idx-1]\n        if val > max_val:\n            max_val = val\n            max_idx = idx\n    print(max_idx)","Wait, but is there a way to do this without building the candidates list?","Yes, perhaps. We can iterate through each element, and for each, check if its frequency is 1. If so, compare its value to the current maximum.","So, that would save some space, but for N up to 3e5, it's manageable either way.","But for the code, perhaps it's more efficient to process in a single pass.","Wait, but the first approach is to create a frequency counter, then iterate through each element, and for each, check if it's unique.","But perhaps, for the second part, when we have the list of candidates, we can find the maximum in a single pass.","But in any case, the approach is manageable.","Now, let's test the sample inputs.","Sample Input 1:","9\n2 9 9 7 9 2 4 5 8","The frequency is:","2:2, 9:3,7:1,4:1,5:1,8:1.","So, the candidates are indices where A_i is unique: positions 4,7,8,9 (since 7 is at index 3 (0-based), 4 is at 6, 5 at 7, 8 at 8.","So the candidates are 4,7,8,9.","Their values are 7,4,5,8.","So, the maximum is 8, so output 9.","Sample Input 2:","4\n1000000000 1000000000 998244353 998244353","Frequency: 1e9 appears 2 times, 998244353 appears 2 times.","So, no candidates. Output -1.","Another test case: N=1. Then, the only person has no others, so it's unique. Output 1.","Another test case: N=2, A = [5,5]. Both have frequency 2. So output -1.","Another test case: N=3, A = [3,1,2]. All are unique. So the maximum is 3, at position 1. So output 1.","Wait, no. Wait, the values are 3,1,2. All are unique. So all are candidates. The maximum is 3, which is at index 1 (label 1). So output 1.","Wait, but in the code, for each i in 0-based, if freq[a[i]] is 1, then add i+1 to the candidates. So in this case, all a[i] have freq 1. So the candidates are 1,2,3.","Then, among them, the maximum a[i] is 3, which is at index 0, label 1.","So code would correctly output 1.","Another test case: N=5, A = [1,2,3,2,1 <script>
const TRACES = JSON.parse(document.getElementById("data").textContent);
const DS = {gsm8k:"GSM8K", webinstruct:"WebInstruct", livecodebench:"LiveCodeBench"};
const CVAR = {continue:"--continue", backtrack:"--backtrack", merge:"--merge", root:"--muted"};
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || "#888";

const byQuery = new Map();
for(const t of TRACES){
  if(!byQuery.has(t.qid)) byQuery.set(t.qid,{dataset:t.dataset,qid:t.qid,models:{}});
  byQuery.get(t.qid).models[t.model]=t;
}
const queries=[...byQuery.values()].sort((a,b)=>
  a.dataset.localeCompare(b.dataset)||a.qid.localeCompare(b.qid));

const state={qid:queries[0].qid, sel:null, mode:{}};
const views={};   // per pane: {g, pos, kids, primary, extra, nodeEls, edgeEls, k, tx, ty}

/* ---------- tidy tree over the spanning tree of primary parents ---------- */
function treeLayout(g){
  const n=g.n, kids=Array.from({length:n},()=>[]), primary=new Array(n).fill(-1);
  for(let i=0;i<n;i++){
    const ps=g.parents[i]||[];
    if(ps.length && ps[0]>=0 && ps[0]<n && ps[0]!==i){ primary[i]=ps[0]; kids[ps[0]].push(i); }
  }
  const x=new Float64Array(n), depth=new Int32Array(n);
  let cursor=0;
  for(let r=0;r<n;r++){
    if(primary[r]!==-1) continue;
    const st=[[r,0,false]];
    while(st.length){
      const fr=st[st.length-1], v=fr[0], d=fr[1];
      if(!fr[2]){
        depth[v]=d; fr[2]=true;
        for(let k=kids[v].length-1;k>=0;k--) st.push([kids[v][k],d+1,false]);
      }else{
        st.pop();
        const c=kids[v];
        x[v] = c.length ? (x[c[0]]+x[c[c.length-1]])/2 : cursor++;
      }
    }
    cursor+=1.2;
  }
  const extra=[];
  for(let i=0;i<n;i++) for(const p of (g.parents[i]||[]).slice(1))
    if(p>=0&&p<n) extra.push([p,i]);
  return {x,depth,kids,primary,extra};
}

function nodeW(label){ return Math.max(30, 11+label.length*6.2); }
const NH=21, XG=54, YG=62;

const mkey = key => state.qid+"|"+key;
const isFull = key => state.mode[mkey(key)]==="full";
function graphOf(t,key){ return isFull(key) ? t.raw : t.merged; }
function labelsOf(t,key){
  const g=graphOf(t,key);
  return isFull(key) ? Array.from({length:g.n},(_,i)=>"s"+i) : g.label;
}

function buildPane(t,key){
  const g=graphOf(t,key), lay=treeLayout(g), labels=labelsOf(t,key);
  const pos=[];
  for(let i=0;i<g.n;i++) pos.push({x:lay.x[i]*XG, y:lay.depth[i]*YG});
  views[key]={t,key,g,lay,labels,pos,k:1,tx:0,ty:0,nodeEls:[],edgeEls:[]};
  return views[key];
}

function edgePath(a,b){
  const dy=Math.max(18,(b.y-a.y)*0.5);
  return `M${a.x} ${a.y+NH/2} C${a.x} ${a.y+NH/2+dy}, ${b.x} ${b.y-NH/2-dy}, ${b.x} ${b.y-NH/2}`;
}

function renderPane(v){
  const {g,pos,labels,key}=v;
  const parts=[];
  parts.push(`<defs>`);
  for(const [a,varname] of Object.entries(CVAR))
    parts.push(`<marker id="ar-${key}-${a}" viewBox="0 0 10 10" refX="9" refY="5" `+
      `markerWidth="5" markerHeight="5" orient="auto-start-reverse">`+
      `<path d="M0 0 L10 5 L0 10 z" fill="var(${varname})"/></marker>`);
  parts.push(`</defs><g id="vp-${key}">`);
  // edges (primary = tree, extra = merge second parents)
  const eIndex=[];
  for(let i=0;i<g.n;i++){
    const p=v.lay.primary[i]; if(p<0) continue;
    const act=g.actions[i]||"continue";
    parts.push(`<path class="edge" data-e="${eIndex.length}" d="${edgePath(pos[p],pos[i])}" `+
      `stroke="var(${CVAR[act]||"--continue"})" stroke-width="${act==="continue"?1.4:2}" `+
      `marker-end="url(#ar-${key}-${act in CVAR?act:"continue"})"/>`);
    eIndex.push([p,i]);
  }
  for(const [p,i] of v.lay.extra){
    parts.push(`<path class="edge" data-e="${eIndex.length}" d="${edgePath(pos[p],pos[i])}" `+
      `stroke="var(--merge)" stroke-width="1.6" stroke-dasharray="4 3" `+
      `marker-end="url(#ar-${key}-merge)"/>`);
    eIndex.push([p,i]);
  }
  v.eIndex=eIndex;
  // nodes
  for(let i=0;i<g.n;i++){
    const act=g.actions[i]||"continue", w=nodeW(labels[i]);
    const sel = state.sel && state.sel.key===key && state.sel.i===i;
    parts.push(`<g class="nd${sel?" sel":""}" data-n="${i}" transform="translate(${pos[i].x},${pos[i].y})">`+
      `<rect x="${-w/2}" y="${-NH/2}" width="${w}" height="${NH}" rx="5" `+
      `fill="var(${CVAR[act]||"--continue"})" stroke="var(--ground)"/>`+
      `<text x="0" y="3.5" text-anchor="middle">${labels[i]}</text></g>`);
  }
  parts.push(`</g>`);
  return `<svg xmlns="http://www.w3.org/2000/svg">${parts.join("")}</svg>`;
}

function fit(v){
  const cv=document.getElementById("cv-"+v.key); if(!cv) return;
  const W=cv.clientWidth, H=cv.clientHeight;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(let i=0;i<v.pos.length;i++){
    const w=nodeW(v.labels[i])/2;
    x0=Math.min(x0,v.pos[i].x-w); x1=Math.max(x1,v.pos[i].x+w);
    y0=Math.min(y0,v.pos[i].y-NH); y1=Math.max(y1,v.pos[i].y+NH);
  }
  const k=Math.min(2, Math.max(0.06, Math.min((W-48)/Math.max(1,x1-x0), (H-48)/Math.max(1,y1-y0))));
  v.k=k; v.tx=W/2-((x0+x1)/2)*k; v.ty=H/2-((y0+y1)/2)*k;
  applyT(v);
}
function applyT(v){
  const vp=document.getElementById("vp-"+v.key);
  if(vp) vp.setAttribute("transform",`translate(${v.tx},${v.ty}) scale(${v.k})`);
}

function paneHTML(t,key){
  if(!t) return `<div class="pane"><div class="phead"><span class="chip">${key}</span>
    <span class="meta">no trace</span></div></div>`;
  const g=graphOf(t,key);
  let bk=0,mg=0;
  for(let i=1;i<g.n;i++){ if(g.actions[i]==="backtrack") bk++; if(g.actions[i]==="merge") mg++; }
  const full=isFull(key);
  return `<div class="pane">
    <div class="phead">
      <span class="chip">${t.model}</span>
      <span class="meta">${g.n} nodes &middot; <span class="bk">${bk} backtrack</span>
        &middot; <span class="mg">${mg} merge</span> &middot;
        <span class="${t.correct?"good":""}">${t.correct?"correct":"incorrect"}</span></span>
      <span class="ctrls">
        <button class="btn" data-mode="${key}" aria-pressed="${!full}">${full?"Full":"Collapsed"}</button>
        <button class="btn" data-fit="${key}">Fit</button>
      </span>
    </div>
    <div class="canvas" id="cv-${key}"></div>
  </div>`;
}

/* ---------- interaction ---------- */
function attach(v){
  const cv=document.getElementById("cv-"+v.key);
  cv.innerHTML=renderPane(v);
  const svg=cv.querySelector("svg");
  v.nodeEls=[...svg.querySelectorAll(".nd")];
  v.edgeEls=[...svg.querySelectorAll(".edge")];
  fit(v);

  let mode=null, sx=0, sy=0, dragI=-1, moved=false;
  cv.addEventListener("pointerdown",e=>{
    const nd=e.target.closest(".nd");
    moved=false; sx=e.clientX; sy=e.clientY;
    if(nd){ mode="node"; dragI=+nd.dataset.n; }
    else { mode="pan"; cv.classList.add("panning"); }
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove",e=>{
    if(!mode) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)>3||Math.abs(dy)>3) moved=true;
    if(mode==="pan"){ v.tx+=dx; v.ty+=dy; sx=e.clientX; sy=e.clientY; applyT(v); }
    else if(mode==="node"&&moved){
      v.pos[dragI].x+=dx/v.k; v.pos[dragI].y+=dy/v.k; sx=e.clientX; sy=e.clientY;
      v.nodeEls[dragI].setAttribute("transform",`translate(${v.pos[dragI].x},${v.pos[dragI].y})`);
      v.eIndex.forEach(([a,b],ei)=>{
        if(a===dragI||b===dragI) v.edgeEls[ei].setAttribute("d",edgePath(v.pos[a],v.pos[b]));
      });
    }
  });
  cv.addEventListener("pointerup",e=>{
    if(mode==="node"&&!moved){ select(v.key,dragI); }
    mode=null; dragI=-1; cv.classList.remove("panning");
  });
  cv.addEventListener("wheel",e=>{
    e.preventDefault();
    const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    const f=Math.exp(-e.deltaY*0.0016), nk=Math.min(3,Math.max(0.04,v.k*f));
    v.tx=mx-(mx-v.tx)*(nk/v.k); v.ty=my-(my-v.ty)*(nk/v.k); v.k=nk; applyT(v);
  },{passive:false});
}

function select(key,i){
  state.sel={key,i};
  for(const k of Object.keys(views)){
    const v=views[k]; if(!v||!v.nodeEls) continue;
    v.nodeEls.forEach((el,j)=>el.classList.toggle("sel", k===key&&j===i));
  }
  renderDetail();
}

function renderDetail(){
  const d=document.getElementById("detail");
  if(!state.sel||!views[state.sel.key]){ d.className="detail empty";
    d.textContent="Click a node to read its reasoning text and the judge’s attachment rationale."; return; }
  const v=views[state.sel.key], i=state.sel.i, g=v.g, t=v.t;
  const act=g.actions[i]||"root", full=isFull(v.key);
  const members = full ? [i] : (g.members[i]||[i]);
  const ps=(g.parents[i]||[]).map(p=>v.labels[p]).join(", ")||"—";
  d.className="detail";
  let html=`<div class="dhead"><span class="chip">${t.model}</span>
    <code>${v.labels[i]}</code><span class="tag ${act}">${act}</span>
    <span class="meta">parents: ${ps} &middot; ${members.length} step${members.length>1?"s":""}</span></div>`;
  if(!full && members.length>1) html+=`<div class="dlabel">Collapsed run of ${members.length} steps</div>`;
  for(const m of members){
    html+=`<div class="step"><div class="sid">s${m}</div>`+
      `<div class="dtext">${esc(t.raw.text[m])}</div>`;
    if(t.raw.why[m]) html+=`<div class="dlabel">judge rationale</div><div class="dwhy">${esc(t.raw.why[m])}</div>`;
    html+=`</div>`;
  }
  d.innerHTML=html;
}
function esc(s){return (s||"").replace(/[<>&]/g,m=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[m]));}

function renderRail(){
  const el=document.getElementById("qlist"); el.innerHTML=""; let cur=null;
  for(const q of queries){
    if(q.dataset!==cur){ cur=q.dataset;
      const h=document.createElement("div"); h.className="grp"; h.textContent=DS[cur]||cur; el.appendChild(h); }
    const b=document.createElement("button");
    b.className="q"; b.setAttribute("aria-current",q.qid===state.qid);
    const a=q.models["32B"], c=q.models["1.5B"];
    b.innerHTML=`<span class="qid">${q.qid}</span><span class="qm">`+
      `<span><b>32B</b> ${a?a.raw.n:"–"}</span><span><b>1.5B</b> ${c?c.raw.n:"–"}</span></span>`;
    b.onclick=()=>{ state.qid=q.qid; state.sel=null; render(); };
    el.appendChild(b);
  }
}

function render(){
  renderRail();
  const q=byQuery.get(state.qid);
  document.getElementById("qtitle").textContent=`${DS[q.dataset]||q.dataset} · ${q.qid}`;
  for(const key of ["32B","1.5B"]){
    const t=q.models[key];
    if(t && !state.mode[mkey(key)]) state.mode[mkey(key)] = t.raw.n>28 ? "collapsed" : "full";
  }
  document.getElementById("panes").innerHTML=
    paneHTML(q.models["32B"],"32B")+paneHTML(q.models["1.5B"],"1.5B");
  for(const key of ["32B","1.5B"]){
    const t=q.models[key]; if(!t){ delete views[key]; continue; }
    attach(buildPane(t,key));
  }
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
    const k=mkey(b.dataset.mode);
    state.mode[k]= state.mode[k]==="full" ? "collapsed" : "full";
    state.sel=null; render();
  });
  document.querySelectorAll("[data-fit]").forEach(b=>b.onclick=()=>fit(views[b.dataset.fit]));
  renderDetail();
}
window.addEventListener("resize",()=>{ for(const k in views) if(views[k]) fit(views[k]); });
render();
</script>
